name: Keep API Awake

# Pings the Render API's /health so the free-tier instance doesn't sleep.
# Runs every 10 minutes (under Render's ~15-min idle window) and can be run
# manually from the Actions tab. Override the URL with a repo variable named
# KEEPALIVE_URL (Settings -> Secrets and variables -> Actions -> Variables).

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

# Don't pile up runs if one is slow (e.g. a cold start).
concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health (wakes the API if it was asleep)
        run: |
          URL="${{ vars.KEEPALIVE_URL }}"
          URL="${URL:-https://plan2done.onrender.com/health}"
          echo "Pinging $URL"
          for i in 1 2 3; do
            if curl -fsS --max-time 90 "$URL"; then
              echo ""
              echo "OK on attempt $i"
              exit 0
            fi
            echo "Attempt $i failed; retrying in 20s (cold start can take ~50s)…"
            sleep 20
          done
          echo "All attempts failed."
          exit 1
